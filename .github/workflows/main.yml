name: devSecOps-Pipline
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOCKER_IMAGE_NAME:  abhishar7225/devsecops-pipeline
  CONTAINER_NAME: node-todo-app
on:
 push:
   branches: [master]
 pull_request:
 workflow_dispatch:
 schedule:
    - cron: '0 2 * * *'
jobs:
 codeql:
   runs-on: ubuntu-latest
   permissions: 
    security-events: write
    contents: read
   steps:
     -  name: Checkout the Code
        uses: actions/checkout@v4
     
     -  name:  init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript 

     -  name: autobuild codeql
        uses: github/codeql-action/autobuild@v3

     -  name: Analyze
        uses: github/codeql-action/analyze@v3
    
 test: 
   runs-on: ubuntu-latest
   strategy:
    matrix:
       node-version: [18,20]
   steps:
      - name: Checkout Code 
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci 

      - name: Run Tests
        run: npm test
         
 build:
   needs: [test, codeql]
   runs-on: ubuntu-latest
   if: github.ref == 'refs/heads/master'
   outputs:
     image-tag: ${{ github.run_number }}

   steps:
      - name: Checkout Code 
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.MY_GITHUB_USERNAME }}
          password: ${{ secrets.MY_GITHUB_PASSWORD }}
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . 
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.run_number }}

 deploy:
   needs: build
   runs-on: ubuntu-latest
   if: github.ref == 'refs/heads/master'
   environment:                          
      name: production
   steps: 
     - name: Checkout Code 
       uses: actions/checkout@v4

     - name: Deplot via SSH 
       uses: appleboy/ssh-action@v1.2.0
       with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          docker pull ${{ env.DOCKER_IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}
          docker stop ${{ env.CONTAINER_NAME }} || true 
          docker rm ${{ env.CONTAINER_NAME }} || true
          docker run -d --name ${{ env.CONTAINER_NAME }} \
           -p 3000:3000 \
           ${{ env.DOCKER_IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}


  

      
 
        
     
    
  
